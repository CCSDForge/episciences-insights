name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dead code check (Knip)
        run: npm run knip

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const fs = require("node:fs");
            const { total } = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
            const rows = [
              "### Test Coverage (`lib/` + `scripts/`)",
              "",
              "| Metric | Covered | Total | % |",
              "| :--- | ---: | ---: | ---: |",
              ...["lines", "statements", "branches", "functions"].map((k) =>
                `| ${k} | ${total[k].covered} | ${total[k].total} | **${total[k].pct}%** |`
              ),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join("\n") + "\n");
          '

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build static export
        run: npm run build
